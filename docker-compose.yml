# Job Intelligence Platform — implantação em VPS com Docker.
#
# Estado atual (declarado, não presumido):
#   - a aplicação usa SQLite embutido, com volume persistente;
#   - `postgres` e `redis` estão declarados sob o perfil `future`, para a
#     migração descrita em docs/architecture.md. Eles NÃO sobem por padrão e a
#     aplicação ainda não os utiliza — subir seria simular uma capacidade que
#     o código não tem.
#
# Suba somente o essencial:      docker compose up -d
# Com a infraestrutura futura:   docker compose --profile future up -d

services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      # APP_ENV=production sinaliza à varredura de prontidão que o processo roda
      # em servidor 24/7 — é o que sustenta a §63: o computador do usuário pode
      # estar desligado. `restart: unless-stopped` acima garante que o agendador
      # volta sozinho depois de uma queda.
      APP_ENV: production
      PORT: 3000
      DB_PATH: /app/data/h2a_system.db
    volumes:
      - app-data:/app/data
      - app-uploads:/app/private_uploads
    networks: [internal]
    # Sem `ports`: o acesso externo passa obrigatoriamente pelo proxy reverso.
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # O Caddyfile lê este valor. Com um domínio real, o HTTPS é emitido e
      # renovado sozinho; vazio, o proxy serve em HTTP na porta 80 — útil para
      # o primeiro teste pelo IP, antes do DNS propagar.
      DOMAIN: ${DOMAIN:-}
    # Somente 80 e 443 são públicos (spec §55).
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]
    depends_on:
      api:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Infraestrutura da migração planejada — não sobe sem o perfil `future`.
  # ---------------------------------------------------------------------------

  postgres:
    profiles: ["future"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-job_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-jobintel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks: [internal]
    # Sem `ports`: a porta 5432 nunca é exposta publicamente (spec §55, §83.4).
    expose: ["5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-jobintel}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    profiles: ["future"]
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    networks: [internal]
    # Sem `ports`: a porta 6379 nunca é exposta publicamente.
    expose: ["6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  # Rede interna: apenas o proxy alcança a internet pública.
  internal:
    driver: bridge

volumes:
  app-data:
  app-uploads:
  caddy-data:
  caddy-config:
  pg-data:
  redis-data:
